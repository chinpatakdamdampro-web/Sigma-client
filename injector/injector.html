<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Spectral — Injector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --deep:     #030210;
    --card:     rgba(10, 6, 26, 0.96);
    --purple:   #9b00ff;
    --pink:     #ff0099;
    --blue:     #0066ff;
    --success:  #00e87a;
    --warn:     #ffaa00;
    --err:      #ff3355;
    --text:     #ece4ff;
    --muted:    rgba(180, 145, 255, 0.65);
    --border:   rgba(155, 0, 255, 0.18);
    --glow-p:   rgba(155, 0, 255, 0.25);
    --glow-k:   rgba(255, 0, 153, 0.18);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--deep);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* ── Background canvas ── */
  #bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; }

  /* ── Ambient orbs ── */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    pointer-events: none;
    will-change: transform;
  }
  .orb-a {
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(155,0,255,.12), transparent 70%);
    top: -160px; left: -160px;
    animation: drift 10s ease-in-out infinite;
  }
  .orb-b {
    width: 360px; height: 360px;
    background: radial-gradient(circle, rgba(255,0,153,.09), transparent 70%);
    bottom: -100px; right: -100px;
    animation: drift 13s ease-in-out infinite reverse;
  }
  .orb-c {
    width: 220px; height: 220px;
    background: radial-gradient(circle, rgba(0,102,255,.07), transparent 70%);
    top: 40%; left: 65%;
    animation: drift 8s ease-in-out infinite 2s;
  }
  @keyframes drift {
    0%,100% { transform: translate(0,0) scale(1); }
    33%      { transform: translate(18px,-22px) scale(1.06); }
    66%      { transform: translate(-12px,14px) scale(0.94); }
  }

  /* ── Grid overlay ── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(155,0,255,.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(155,0,255,.025) 1px, transparent 1px);
    background-size: 44px 44px;
    pointer-events: none;
    z-index: 1;
  }

  /* ── Card ── */
  .card {
    width: 420px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 26px;
    padding: 38px 36px 30px;
    position: relative;
    z-index: 10;
    backdrop-filter: blur(48px) saturate(180%);
    box-shadow:
      0 0 0 1px rgba(255,255,255,.04) inset,
      0 24px 70px rgba(0,0,0,.55),
      0 0 100px rgba(155,0,255,.07);
    animation: slideUp .55s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes slideUp {
    from { opacity:0; transform: translateY(24px) scale(.96); }
    to   { opacity:1; transform: translateY(0)    scale(1);   }
  }

  /* Top shimmer line */
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 15%; right: 15%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--purple), var(--pink), var(--purple), transparent);
    animation: shimmer 3.5s ease-in-out infinite;
    border-radius: 1px;
  }
  @keyframes shimmer {
    0%,100% { opacity:.35; transform: scaleX(.75); }
    50%      { opacity:.9;  transform: scaleX(1.1); }
  }

  /* ── Logo ── */
  .logo { text-align: center; margin-bottom: 26px; }
  .logo-hex {
    width: 64px; height: 64px; margin: 0 auto 14px;
    background: linear-gradient(135deg, rgba(155,0,255,.18), rgba(255,0,153,.15));
    border: 1px solid rgba(155,0,255,.28);
    border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; position: relative;
    box-shadow: 0 0 36px rgba(155,0,255,.22), 0 0 70px rgba(155,0,255,.08);
    animation: hexPulse 3s ease-in-out infinite;
  }
  @keyframes hexPulse {
    0%,100% { box-shadow: 0 0 36px rgba(155,0,255,.22), 0 0 70px rgba(155,0,255,.08); }
    50%      { box-shadow: 0 0 50px rgba(155,0,255,.35), 0 0 90px rgba(255,0,153,.12); }
  }
  .logo h1 {
    font-size: 22px; font-weight: 700;
    letter-spacing: 5px; text-transform: uppercase;
    background: linear-gradient(90deg, var(--purple), var(--pink), var(--purple));
    background-size: 200% auto;
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradientFlow 4s linear infinite;
  }
  @keyframes gradientFlow {
    from { background-position: 0% center; }
    to   { background-position: 200% center; }
  }
  .logo sub {
    display: block; font-size: 10.5px; letter-spacing: 2px;
    color: var(--muted); margin-top: 5px; font-weight: 400;
  }

  /* ── Process block ── */
  .proc-block {
    background: rgba(155,0,255,.04);
    border: 1px solid rgba(155,0,255,.11);
    border-radius: 13px;
    padding: 13px 15px;
    margin-bottom: 16px;
  }
  .proc-label {
    font-size: 9.5px; letter-spacing: 2px; color: var(--muted);
    text-transform: uppercase; margin-bottom: 8px; font-weight: 500;
  }
  .proc-row { display: flex; align-items: center; gap: 9px; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    background: var(--warn); box-shadow: 0 0 8px var(--warn);
    animation: blink 1.4s ease-in-out infinite;
  }
  .dot.ok  { background: var(--success); box-shadow: 0 0 8px var(--success); animation: none; }
  .dot.err { background: var(--err);     box-shadow: 0 0 8px var(--err);     animation: none; }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:.35;} }
  .proc-text { font-size: 13px; font-weight: 500; flex: 1; }
  .proc-pid  {
    font-family: 'JetBrains Mono', monospace; font-size: 10.5px;
    color: var(--muted); background: rgba(155,0,255,.09);
    padding: 2px 8px; border-radius: 5px; display: none;
  }

  /* ── Options ── */
  .options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
  .opt {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 12px; border-radius: 11px;
    background: rgba(255,255,255,.018);
    border: 1px solid rgba(255,255,255,.04);
    cursor: pointer;
    transition: background .18s ease, border-color .18s ease;
  }
  .opt:hover { background: rgba(155,0,255,.06); border-color: rgba(155,0,255,.14); }
  .opt-label { font-size: 12px; color: var(--muted); font-weight: 400; }

  /* Toggle switch */
  .sw {
    width: 38px; height: 21px; border-radius: 11px;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.09);
    position: relative; cursor: pointer;
    transition: background .25s ease, border-color .25s ease, box-shadow .25s ease;
    flex-shrink: 0;
  }
  .sw.on {
    background: linear-gradient(90deg, var(--purple), var(--pink));
    border-color: transparent;
    box-shadow: 0 0 14px rgba(155,0,255,.4);
  }
  .sw::after {
    content: '';
    position: absolute; top: 2px; left: 2px;
    width: 15px; height: 15px; border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,.35);
    transition: left .28s cubic-bezier(.34,1.56,.64,1);
  }
  .sw.on::after { left: 19px; }

  /* ── Inject button ── */
  .inject-wrap { position: relative; margin-bottom: 13px; }
  .spin-ring {
    display: none; position: absolute; inset: -3px; border-radius: 20px;
    background: conic-gradient(from 0deg, transparent 0deg, var(--purple) 80deg, var(--pink) 160deg, transparent 240deg);
    animation: spinRing 1.1s linear infinite;
    z-index: -1; opacity: 0; transition: opacity .3s;
  }
  .spin-ring.active { display: block; opacity: 1; }
  @keyframes spinRing { to { transform: rotate(360deg); } }

  .inject-btn {
    width: 100%; padding: 17px;
    border: none; border-radius: 16px;
    font-size: 13.5px; font-weight: 700;
    letter-spacing: 4px; text-transform: uppercase;
    font-family: 'Space Grotesk', sans-serif;
    cursor: pointer; position: relative; overflow: hidden;
    background: linear-gradient(135deg, var(--purple), var(--pink));
    color: #fff;
    box-shadow: 0 0 24px rgba(155,0,255,.3), 0 6px 18px rgba(0,0,0,.35);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .inject-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 0 40px rgba(155,0,255,.5), 0 0 70px rgba(255,0,153,.18), 0 10px 28px rgba(0,0,0,.4);
  }
  .inject-btn:active:not(:disabled) { transform: translateY(0); }
  .inject-btn:disabled { cursor: default; }
  .inject-btn.done {
    background: linear-gradient(135deg, #008844, #00e87a);
    box-shadow: 0 0 30px rgba(0,232,122,.35);
  }

  /* Sweep shine on hover */
  .inject-btn::before {
    content: ''; position: absolute;
    top: 0; left: -110%; width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent);
    transition: left .5s ease;
  }
  .inject-btn:hover::before { left: 110%; }

  /* ── Log ── */
  .log {
    background: rgba(0,0,0,.28);
    border: 1px solid rgba(155,0,255,.07);
    border-radius: 11px; padding: 11px 13px;
    height: 96px; overflow-y: auto; margin-bottom: 14px;
    font-family: 'JetBrains Mono', monospace; font-size: 10.5px; line-height: 1.6;
  }
  .log::-webkit-scrollbar { width: 3px; }
  .log::-webkit-scrollbar-thumb { background: rgba(155,0,255,.25); border-radius: 2px; }
  .log::-webkit-scrollbar-track { background: transparent; }
  .ll { animation: logSlide .22s ease both; }
  @keyframes logSlide { from{opacity:0;transform:translateX(-4px)} to{opacity:1;transform:none} }
  .ts  { color: rgba(155,0,255,.5); }
  .tok { color: var(--success); }
  .tin { color: var(--muted); }
  .twn { color: var(--warn); }
  .ter { color: var(--err); }

  /* ── Footer ── */
  .footer { display: flex; justify-content: space-between; align-items: center; }
  .fv  { font-size: 9.5px; color: rgba(170,130,255,.35); letter-spacing: 1px; }
  .fst { font-size: 9.5px; color: rgba(170,130,255,.35); }

  /* ── Keybind badge ── */
  .keybind {
    display: inline-block; padding: 1px 6px;
    background: rgba(155,0,255,.1); border: 1px solid rgba(155,0,255,.2);
    border-radius: 5px; font-size: 9px; color: var(--muted);
    font-family: 'JetBrains Mono', monospace; margin-left: 4px;
  }
</style>
</head>
<body>
  <canvas id="bg"></canvas>
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>
  <div class="orb orb-c"></div>

  <div class="card">
    <div class="logo">
      <div class="logo-hex">⬡</div>
      <h1>Spectral</h1>
      <sub>Utility Client · v1.0 · Fabric 1.21.1</sub>
    </div>

    <div class="proc-block">
      <div class="proc-label">Process</div>
      <div class="proc-row">
        <div class="dot" id="dot"></div>
        <div class="proc-text" id="procText">Scanning for javaw.exe…</div>
        <div class="proc-pid" id="pid"></div>
      </div>
    </div>

    <div class="options">
      <div class="opt" onclick="toggleSw(this)">
        <span class="opt-label">Open menu on inject <span class="keybind">INSERT</span></span>
        <div class="sw on"></div>
      </div>
      <div class="opt" onclick="toggleSw(this)">
        <span class="opt-label">Stealth — hide from task list</span>
        <div class="sw"></div>
      </div>
      <div class="opt" onclick="toggleSw(this)">
        <span class="opt-label">Restore saved config</span>
        <div class="sw on"></div>
      </div>
    </div>

    <div class="inject-wrap">
      <div class="spin-ring" id="ring"></div>
      <button class="inject-btn" id="injectBtn" onclick="inject()">Inject</button>
    </div>

    <div class="log" id="log"></div>

    <div class="footer">
      <span class="fv">BUILD 2024.12.01 — JNI BRIDGE v3</span>
      <span class="fst" id="footerSt">READY</span>
    </div>
  </div>

<script>
// ── Particle canvas ─────────────────────────────────────
const bg = document.getElementById('bg');
const ctx = bg.getContext('2d');
const resize = () => { bg.width = innerWidth; bg.height = innerHeight; };
resize(); addEventListener('resize', resize);

class P {
  constructor() { this.init(); }
  init() {
    this.x  = Math.random() * bg.width;
    this.y  = Math.random() * bg.height;
    this.r  = Math.random() * 1.6 + .4;
    this.vx = (Math.random() - .5) * .25;
    this.vy = -(Math.random() * .45 + .05);
    this.a  = Math.random() * .55 + .1;
    this.life = 1;
    this.fade = Math.random() * .003 + .0015;
    this.col = Math.random() > .5
      ? `rgba(155,0,255,${this.a})`
      : `rgba(255,0,153,${this.a})`;
  }
  tick() {
    this.x += this.vx; this.y += this.vy; this.life -= this.fade;
    if (this.life <= 0) this.init();
  }
  draw() {
    ctx.globalAlpha = this.life * this.a;
    ctx.fillStyle   = this.col;
    ctx.shadowBlur  = 5; ctx.shadowColor = this.col;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fill();
  }
}
const ps = Array.from({length: 90}, () => new P());
(function frame() {
  ctx.clearRect(0, 0, bg.width, bg.height);
  ctx.shadowBlur = 0;
  ps.forEach(p => { p.tick(); p.draw(); });
  requestAnimationFrame(frame);
})();

// ── Toggle switch ────────────────────────────────────────
function toggleSw(row) { row.querySelector('.sw').classList.toggle('on'); }

// ── Log ─────────────────────────────────────────────────
const logEl = document.getElementById('log');
function log(msg, type = 'in') {
  const d = new Date();
  const ts = [d.getHours(), d.getMinutes(), d.getSeconds()]
    .map(n => String(n).padStart(2,'0')).join(':');
  const div = document.createElement('div');
  div.className = 'll';
  div.innerHTML = `<span class="ts">[${ts}]</span> <span class="t${type}">${msg}</span>`;
  logEl.appendChild(div);
  logEl.scrollTop = 99999;
}

// ── Process detection sim ────────────────────────────────
let detected = false;
log('Initializing process scanner…');
setTimeout(() => log('Searching for javaw.exe in process list…'), 600);
setTimeout(() => {
  log('Minecraft 1.21.1-Fabric detected', 'ok');
  const d = document.getElementById('dot');
  d.classList.add('ok');
  document.getElementById('procText').textContent = 'Minecraft 1.21.1 (Fabric)';
  const pid = document.getElementById('pid');
  pid.textContent = 'PID 19472'; pid.style.display = '';
  document.getElementById('footerSt').textContent = 'PROCESS FOUND';
  detected = true;
}, 1600);

// ── Inject sequence ──────────────────────────────────────
let done = false;
function inject() {
  if (done) return;
  if (!detected) { log('No Minecraft process detected.', 'er'); return; }
  done = true;

  const btn  = document.getElementById('injectBtn');
  const ring = document.getElementById('ring');
  btn.disabled = true;
  btn.textContent = 'Injecting…';
  ring.classList.add('active');

  const steps = [
    [200,  'Attaching to PID 19472…'],
    [500,  'Locating JVM base address…'],
    [850,  'Allocating remote memory region (0x3F000 bytes)…'],
    [1150, 'Writing spectral_client.dll path to process…'],
    [1400, 'Calling LoadLibraryA via CreateRemoteThread…'],
    [1750, 'DLL loaded — waiting for JNI bridge init…', 'ok'],
    [2050, 'JVM handle acquired (JavaVM* 0x7FF3A2C00000)', 'ok'],
    [2250, 'Registering native methods (47 functions)…'],
    [2500, 'Module manager initialised — 47 modules', 'ok'],
    [2700, 'ImGui 1.90 context created, wglSwapBuffers hooked', 'ok'],
    [2950, 'Config loaded from spectral_config.json', 'ok'],
    [3200, '⬡ Spectral active — press INSERT to open menu', 'ok'],
  ];

  steps.forEach(([t, msg, type]) =>
    setTimeout(() => log(msg, type ?? 'in'), t)
  );

  setTimeout(() => {
    ring.classList.remove('active');
    btn.classList.add('done');
    btn.textContent = '✓  Injected';
    document.getElementById('footerSt').textContent = 'CLIENT ACTIVE';
  }, 3350);
}
</script>
</body>
</html>
