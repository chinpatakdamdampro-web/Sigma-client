plugins {
    id 'fabric-loom' version '1.6-SNAPSHOT'
    id 'maven-publish'
}

version = '1.0.0'
group   = 'com.spectral'

base { archivesName = 'spectral-client' }

repositories {
    maven { url 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft    'com.mojang:minecraft:1.21.1'
    mappings     'net.fabricmc:yarn:1.21.1+build.3:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.15.11'
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.103.0+1.21.1"
}

processResources {
    inputs.property 'version', project.version
    filteringCharset 'UTF-8'
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach { it.options.release = 21 }

jar {
    from('LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } }
}
